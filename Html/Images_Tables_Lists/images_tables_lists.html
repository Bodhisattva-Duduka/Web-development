<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This website contains images tables and lists">
    <title>Images Tables Lists</title>
    <link rel="stylesheet" href="images_tables_lists_css_file.css">

<body>
    <img height="200" src="image_of_welcome.png" alt="welcome image">

        <thead>
            <tr>
                <th>Name</th>

            </tr>

        <tbody>
            <tr>
                <td>Bodhisattva</td>
                <td>Engineer</td>

                <td>Rahul</td>
                <td>Data analyst</td>
            </tr>
            <tr>
                <td>sunny </td>
                <td> AI Engineer</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Koushik </td>
                <td rowspan="2">Business</td>
            </tr>
            <td>Sarvajeeth </td>
            </tr>
        </tfoot>
    </table>
    <br>
    <ul>
        <li>red</li>
        <li>yellow</li>
        <li>blue</li>
        <li>white</li>
        <li>black</li>
    </ul>
    <ol type="A">
        <li>red</li>
        <li>yellow</li>
        <li>blue</li>
        <li>white</li>
        <li>black</li>
    </ol>

</body>

</html>
