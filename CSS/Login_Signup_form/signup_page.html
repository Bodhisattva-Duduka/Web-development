<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up</title>
    <link rel="stylesheet" href="signup_page.css" />
  </head>
  <body>
    <div class="signup_text">Sign-up</div>
    <div class="mainblock">
      <div class="items">
        <form action="">
          <div class="details firstname">
            <input
              type="text"
              name="firstname"
              id="firstname"
              placeholder="First Name"
            />
          </div>
          <div class="details lastname">
            <input
              type="text"
              name="lastname"
              id="lastname"
              placeholder="Last Name"
            />
          </div>
          <div class="details email_id">
            <input
              type="email"
              name="email_id"
              id="email_id"
              placeholder="Email ID"
            />
          </div>
          <div class="details gender">
            <input type="radio" name="gender" id="gender_male" />Male
            <input type="radio" name="gender" id="gender_female" />Female
          </div>
          <div class="details reset">
            <label for="reset"></label>
            <input type="reset" value="Reset" />
          </div>
          <div class="details submit">
            <label for="submit"></label>
            <input type="submit" value="Submit" />
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
