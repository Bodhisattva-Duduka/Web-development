<html lang="en">

    <title>Login Page</title>
</head>
<body>
    <main>
        <header><h1>Login</h1></header>
        <form action="">
            <div class="login">
                <!-- <input type="image" src="google_logo.png" alt="google_logo" class="google_logo"> -->
                <input id="google_button" type="button" value="Continue with Google"></a>
