<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .button {
        padding: 15px;
        font-family: "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
        border-radius: 15px;
        background-color: beige;
        border: 2px solid black;
      }
      .button:hover{
        background-color: black;
        color: beige;
      }
      .content{
        width: 100%;
        height: fit-content;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="content">
        <button class="button">New Cat Image</button>
      <img src="" alt="image of cat" width="400px" />
    </div>
    <script src="script.js"></script>
  </body>
</html>
